        // --------------------------------------------------------------------
        // 1. MOTOR DE CACHE LOCAL (L1 Memória + L2 localStorage)
        // --------------------------------------------------------------------
        class LocalCacheEngine {
          constructor(storageKey, ttlMs) {
            this.storageKey = storageKey;
            this.ttlMs = ttlMs;
            this.memory = new Map();
            this.stats = { hits: 0, misses: 0, lastBuildMs: 0 };
            this._hydrate();
          }
          _hydrate() {
            try {
              const raw = localStorage.getItem(this.storageKey);
              if (!raw) return;
              const parsed = JSON.parse(raw);
              if (parsed && parsed.expiresAt > Date.now() && parsed.entries) {
                Object.entries(parsed.entries).forEach(([k, v]) => this.memory.set(k, v));
              } else {
                localStorage.removeItem(this.storageKey);
              }
            } catch (e) {
              localStorage.removeItem(this.storageKey);
            }
          }
          _persist() {
            try {
              const entries = {};
              this.memory.forEach((v, k) => (entries[k] = v));
              localStorage.setItem(this.storageKey, JSON.stringify({ expiresAt: Date.now() + this.ttlMs, entries }));
            } catch (e) {}
          }
          getOrCompute(key, fn) {
            const t0 = performance.now();
            if (this.memory.has(key)) {
              this.stats.hits += 1;
              this.stats.lastBuildMs = Math.max(0.1, Number((performance.now() - t0).toFixed(2)));
              return this.memory.get(key);
            }
            this.stats.misses += 1;
            const res = fn();
            this.memory.set(key, res);
            this._persist();
            this.stats.lastBuildMs = Math.max(0.1, Number((performance.now() - t0).toFixed(2)));
            return res;
          }
          invalidateAll() {
            this.memory.clear();
            try {
              localStorage.removeItem(this.storageKey);
            } catch (e) {}
          }
        }

        // --------------------------------------------------------------------
        // 2. MOTOR MATEMÁTICO E RATEIO OFICIAL (EXATAS FÓRMULAS SOLICITADAS)
        // --------------------------------------------------------------------
        function calcularNotaIndividualAuditoria(preco, estoque, transparencia) {
          return 0.50 * preco + 0.30 * estoque + 0.20 * transparencia;
        }

        function calcularCMA(auditoriasLoja, mediaCidade = 7.0, minimoConfianca = 10) {
          if (!auditoriasLoja || auditoriasLoja.length === 0) return mediaCidade.toFixed(1);

          let somaPonderada = 0;
          let pesoTotal = 0;

          auditoriasLoja.forEach((aud) => {
            const notaIndividual = calcularNotaIndividualAuditoria(aud.preco, aud.estoque, aud.transparencia);
            const peso = aud.rechecadaSupervisor ? 1.5 : 1.0;
            somaPonderada += notaIndividual * peso;
            pesoTotal += peso;
          });

          const mediaPonderadaLoja = somaPonderada / pesoTotal;
          const cmaFinal = (pesoTotal * mediaPonderadaLoja + minimoConfianca * mediaCidade) / (pesoTotal + minimoConfianca);

          return Math.min(10, Math.max(0, cmaFinal)).toFixed(1);
        }

        // Rateio Financeiro da Receita Líquida da Praça (45% / 35% / 10% / 10%)
        function calcularRateioPraca(receitaLiquida, fiscaisCampo = []) {
          const plataformaADMs = +(receitaLiquida * 0.45).toFixed(2);
          const poolFiscaisCampo = +(receitaLiquida * 0.35).toFixed(2);
          const fiscalSupervisor = +(receitaLiquida * 0.10).toFixed(2);
          const gestorRegional = +(receitaLiquida * 0.10).toFixed(2);

          const ativos = fiscaisCampo.filter((f) => !f.blocked && !f.suspended);
          const pesosPorFiscal = ativos.map((f) => {
            const mult = f.reputation > 90 ? 1.2 : 1.0;
            const pontos = (f.completedMissions || 0) * mult;
            return { id: f.id, mult, pontos };
          });
          const somaPontos = pesosPorFiscal.reduce((s, x) => s + x.pontos, 0);

          const distribuicaoFiscais = {};
          pesosPorFiscal.forEach((item) => {
            distribuicaoFiscais[item.id] = {
              multiplicador: item.mult,
              pontosPonderados: Number(item.pontos.toFixed(1)),
              cotaEstimada: somaPontos > 0 ? +((poolFiscaisCampo * item.pontos) / somaPontos).toFixed(2) : 0,
            };
          });

          return {
            plataformaADMs,
            poolFiscaisCampo,
            fiscalSupervisor,
            gestorRegional,
            somaPontosPonderados: Number(somaPontos.toFixed(1)),
            distribuicaoFiscais,
          };
        }

        function loadState() {
          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) {
              const seed = createInitialState();
              localStorage.setItem(STORAGE_KEY, JSON.stringify(seed));
              return seed;
            }
            const parsed = JSON.parse(raw);
            if (!parsed || !Array.isArray(parsed.plazas) || !Array.isArray(parsed.team) || !Array.isArray(parsed.supermarkets)) {
              const seed = createInitialState();
              localStorage.setItem(STORAGE_KEY, JSON.stringify(seed));
              return seed;
            }
            return parsed;
          } catch (e) {
            const seed = createInitialState();
            localStorage.setItem(STORAGE_KEY, JSON.stringify(seed));
            return seed;
          }
        }

        let state = loadState();
        let selectedMissionId = null;

        function saveState(invalidate = true) {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          } catch (e) {}
          if (invalidate) cacheEngine.invalidateAll();
        }

        // --------------------------------------------------------------------
        // 4. HELPERS & CONTEXTO DE PRAÇA / SESSÃO
        // --------------------------------------------------------------------
        function formatBRL(v) {
          return Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function formatRelativeTime(iso) {
          const d = new Date(iso);
          const mins = Math.max(1, Math.round((Date.now() - d.getTime()) / 60000));
          if (mins < 60) return `há ${mins} min`;
          const hrs = Math.floor(mins / 60);
          if (hrs < 24) {
            return `Hoje, ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
          }
          return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
        }

        function esc(str) {
          return String(str || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }

        const getPlaza = (id) => state.plazas.find((p) => p.id === id) || null;
        const getPlazaName = (id) => (id === 'all' || id === 'global' ? 'Todas as Praças (Global)' : getPlaza(id)?.name || id);
        const getMarket = (id) => state.supermarkets.find((m) => m.id === id) || null;
        const getProduct = (id) => state.products.find((p) => p.id === id) || null;
        const getUser = (id) => state.team.find((u) => u.id === id) || null;

        function getSessionRoleBase() {
          if (state.activeSessionProfile === 'admin_hevert' || state.activeSessionProfile === 'admin_robson') return 'admin';
          return state.activeSessionProfile;
        }

        function getActiveSessionUser(role) {
          if (role === 'admin') {
            const targetId = state.activeSessionProfile === 'admin_robson' ? 'usr-adm-robson' : state.activeSessionProfile === 'admin_hevert' ? 'usr-adm-hevert' : state.sessionUserIds.admin;
            return state.team.find((u) => u.id === targetId) || state.team.find((u) => u.role === 'admin');
          }
          const id = state.sessionUserIds[role];
          const found = state.team.find((u) => u.id === id && u.role === role);
          if (found) return found;
          return state.team.find((u) => u.role === role) || state.team[0];
        }

        // --------------------------------------------------------------------
        // 5. DOMÍNIO CACHEADO MULTIPRAÇA (CMA, COMPARADOR, RATEIO & DASHBOARD)
        // --------------------------------------------------------------------
        function getCmaRankingCached(plazaFilter = 'all') {
          return cacheEngine.getOrCompute(`cma_ranking_${plazaFilter}`, () => {
            return state.supermarkets
              .filter((m) => (plazaFilter === 'all' ? true : m.plazaId === plazaFilter))
              .map((mkt) => {
                const audits = Array.isArray(mkt.audits) ? mkt.audits : [];
                const count = audits.length;
                const avgPreco = count ? Number((audits.reduce((s, a) => s + a.preco, 0) / count).toFixed(1)) : 7.0;
                const avgEstoque = count ? Number((audits.reduce((s, a) => s + a.estoque, 0) / count).toFixed(1)) : 7.0;
                const avgTransp = count ? Number((audits.reduce((s, a) => s + a.transparencia, 0) / count).toFixed(1)) : 7.0;
                const recheckedCount = audits.filter((a) => a.rechecadaSupervisor).length;
                const cmaScore = Number(calcularCMA(audits, 7.0, 10));
                const planObj = PLANS[mkt.plan] || PLANS.essencial;

                return {
                  ...mkt,
                  plazaName: getPlazaName(mkt.plazaId),
                  planObj,
                  auditCount: count,
                  recheckedCount,
                  scores: { preco: avgPreco, estoque: avgEstoque, transparencia: avgTransp },
                  cmaScore,
                };
              })
              .sort((a, b) => {
                if (b.cmaScore !== a.cmaScore) return b.cmaScore - a.cmaScore;
                return b.planObj.priority - a.planObj.priority;
              });
          });
        }

        function getProductComparisonsCached(plazaFilter = 'all') {
          return cacheEngine.getOrCompute(`cma_comparisons_${plazaFilter}`, () => {
            const ranking = getCmaRankingCached(plazaFilter);
            const mktMap = new Map(ranking.map((m) => [m.id, m]));

            return state.products.map((prod) => {
              const entries = prod.prices
                .map((entry) => {
                  const mkt = mktMap.get(entry.marketId);
                  if (!mkt) return null;
                  return {
                    ...entry,
                    marketName: mkt.name,
                    plazaId: mkt.plazaId,
                    plazaName: mkt.plazaName,
                    neighborhood: mkt.neighborhood,
                    plan: mkt.plan,
                    planObj: mkt.planObj,
                    cmaScore: mkt.cmaScore,
                  };
                })
                .filter(Boolean)
                .sort((a, b) => {
                  if (a.price !== b.price) return a.price - b.price;
                  return b.planObj.priority - a.planObj.priority;
                });

              const minPrice = entries.length ? entries[0].price : 0;
              const maxPrice = entries.length ? entries[entries.length - 1].price : 0;
              const avgPrice = entries.length ? entries.reduce((s, x) => s + x.price, 0) / entries.length : 0;
              const savingsPct = maxPrice > 0 ? Math.round(((maxPrice - minPrice) / maxPrice) * 100) : 0;

              return { ...prod, entries, minPrice, maxPrice, avgPrice, savingsPct };
            });
          });
        }

        // Calcula o rateio respeitando o escopo da praça (e somando corretamente por praça quando 'all')
        function getFinancialSummaryCached(plazaFilter = 'all') {
          return cacheEngine.getOrCompute(`financial_${plazaFilter}`, () => {
            const targetPlazas = plazaFilter === 'all' ? state.plazas : state.plazas.filter((p) => p.id === plazaFilter);

            let receitaBrutaTotal = 0;
            let taxaOperacionalTotal = 0;
            let receitaLiquidaTotal = 0;
            let admTotal = 0;
            let poolTotal = 0;
            let supTotal = 0;
            let regTotal = 0;
            const distribuicaoFiscais = {};
            const breakdownPorPraca = [];

            targetPlazas.forEach((p) => {
              const pMarkets = state.supermarkets.filter((m) => m.plazaId === p.id);
              const pFiscais = state.team.filter((u) => u.role === 'field' && u.plazaId === p.id);
              const bruta = pMarkets.reduce((s, m) => s + (PLANS[m.plan]?.fee || 0), 0);
              const taxa = +(bruta * 0.10).toFixed(2);
              const liquida = +(bruta - taxa).toFixed(2);
              const rateio = calcularRateioPraca(liquida, pFiscais);

              receitaBrutaTotal += bruta;
              taxaOperacionalTotal += taxa;
              receitaLiquidaTotal += liquida;
              admTotal += rateio.plataformaADMs;
              poolTotal += rateio.poolFiscaisCampo;
              supTotal += rateio.fiscalSupervisor;
              regTotal += rateio.gestorRegional;

              Object.assign(distribuicaoFiscais, rateio.distribuicaoFiscais);

              breakdownPorPraca.push({
                plazaId: p.id,
                plazaName: p.name,
                marketsCount: pMarkets.length,
                paidCount: pMarkets.filter((m) => m.plan !== 'essencial').length,
                bruta,
                liquida,
                rateio,
              });
            });

            const fiscaisScope = state.team.filter((u) => u.role === 'field' && (plazaFilter === 'all' ? true : u.plazaId === plazaFilter));
            const activeFiscais = fiscaisScope.filter((u) => !u.blocked && !u.suspended);
            const supervisors = state.team.filter((u) => u.role === 'supervisor' && !u.suspended && (plazaFilter === 'all' ? true : u.plazaId === plazaFilter));
            const totalMissoesValidas = activeFiscais.reduce((s, u) => s + (u.completedMissions || 0), 0);
            const ratioPerSup = supervisors.length > 0 ? Math.round(activeFiscais.length / supervisors.length) : activeFiscais.length;

            return {
              receitaBruta: +receitaBrutaTotal.toFixed(2),
              taxaOperacional: +taxaOperacionalTotal.toFixed(2),
              receitaLiquida: +receitaLiquidaTotal.toFixed(2),
              rateio: {
                plataformaADMs: +admTotal.toFixed(2),
                poolFiscaisCampo: +poolTotal.toFixed(2),
                fiscalSupervisor: +supTotal.toFixed(2),
                gestorRegional: +regTotal.toFixed(2),
                distribuicaoFiscais,
              },
              breakdownPorPraca,
              activeFiscaisCount: activeFiscais.length,
              totalFiscaisCount: fiscaisScope.length,
              supervisorsCount: supervisors.length,
              totalMissoesValidas,
              ratioLabel: `1 : ${ratioPerSup}`,
              paidMarketsCount: state.supermarkets.filter((m) => (plazaFilter === 'all' ? true : m.plazaId === plazaFilter) && m.plan !== 'essencial').length,
            };
          });
        }

        function getDashboardMetricsCached(plazaFilter = 'all') {
          return cacheEngine.getOrCompute(`dashboard_metrics_${plazaFilter}`, () => {
            const ranking = getCmaRankingCached(plazaFilter);
            const fin = getFinancialSummaryCached(plazaFilter);
            const fiscais = state.team.filter((u) => u.role === 'field' && (plazaFilter === 'all' ? true : u.plazaId === plazaFilter));
            const cols = state.collections.filter((c) => (plazaFilter === 'all' ? true : c.plazaId === plazaFilter));

            const mrrBruto = fin.receitaBruta;
            const receitaLiquida = fin.receitaLiquida;
            const margemLiquidaPct = mrrBruto > 0 ? +((receitaLiquida / mrrBruto) * 100).toFixed(1) : 0;
            const margemPlataformaPct = mrrBruto > 0 ? +((fin.rateio.plataformaADMs / mrrBruto) * 100).toFixed(1) : 0;

            const reviewedCols = cols.filter((c) => c.status !== 'pending_supervisor');
            const confirmedCols = cols.filter((c) => c.status === 'confirmed');
            const validationRatePct = reviewedCols.length > 0 ? +((confirmedCols.length / reviewedCols.length) * 100).toFixed(1) : 100.0;

            const totalAudits = ranking.reduce((s, m) => s + m.auditCount, 0);
            const totalRechecked = ranking.reduce((s, m) => s + m.recheckedCount, 0);
            const recheckCoveragePct = totalAudits > 0 ? +((totalRechecked / totalAudits) * 100).toFixed(1) : 0;

            const cmaMedioPraca = ranking.length > 0 ? +(ranking.reduce((s, m) => s + m.cmaScore, 0) / ranking.length).toFixed(1) : 7.0;

            const teamPerformance = fiscais
              .map((f) => {
                const dist = fin.rateio.distribuicaoFiscais[f.id] || {
                  multiplicador: f.reputation > 90 ? 1.2 : 1.0,
                  cotaEstimada: 0,
                  pontosPonderados: 0,
                };
                const fCols = state.collections.filter((c) => c.inspectorId === f.id && c.status !== 'pending_supervisor');
                const fConfirmed = fCols.filter((c) => c.status === 'confirmed').length;
                const approvalRate = fCols.length > 0 ? Math.round((fConfirmed / fCols.length) * 100) : Math.min(100, Math.max(60, f.reputation));

                return {
                  ...f,
                  plazaName: getPlazaName(f.plazaId),
                  multiplicador: dist.multiplicador,
                  cotaEstimada: dist.cotaEstimada,
                  approvalRate,
                  reviewedCount: fCols.length,
                };
              })
              .sort((a, b) => b.reputation - a.reputation || b.completedMissions - a.completedMissions);

            return {
              mrrBruto,
              receitaLiquida,
              margemLiquidaPct,
              margemPlataformaPct,
              reviewedCount: reviewedCols.length,
              confirmedCount: confirmedCols.length,
              pendingCount: cols.length - reviewedCols.length,
              validationRatePct,
              totalAudits,
              totalRechecked,
              recheckCoveragePct,
              cmaMedioPraca,
              teamPerformance,
            };
          });
        }

        function getNoticesForUser(role, userId, plazaId) {
          return state.notices
            .filter((n) => {
              if (n.recipientUserId) return n.recipientUserId === userId;
              const roleMatch = n.target === 'all' || n.target === role;
              const plazaMatch = !n.scopePlazaId || n.scopePlazaId === 'global' || n.scopePlazaId === plazaId;
              return roleMatch && plazaMatch;
            })
            .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        }

        // --------------------------------------------------------------------
        // 6. TOASTS, MODAL & MURAL FIXO DE NOTAS DA ADMINISTRAÇÃO
        // --------------------------------------------------------------------
        function showToast(msg, type = 'success') {
          const region = document.getElementById('toast-region');
          const el = document.createElement('div');
          const cls =
            type === 'success'
              ? 'bg-emerald-950 text-emerald-50 border-emerald-800'
              : type === 'warning'
              ? 'bg-amber-950 text-amber-50 border-amber-800'
              : 'bg-rose-950 text-rose-50 border-rose-800';
          const icon = type === 'success' ? 'check-circle-2' : type === 'warning' ? 'alert-triangle' : 'x-circle';
          el.className = `pointer-events-auto flex items-start gap-3 px-4 py-3 rounded-xl border shadow-lg text-sm ui-transition ${cls}`;
          el.innerHTML = `<i data-lucide="${icon}" class="w-4 h-4 mt-0.5 shrink-0"></i><span class="flex-1 leading-snug">${esc(msg)}</span>`;
          region.appendChild(el);
          if (window.lucide) lucide.createIcons({ root: el });
          setTimeout(() => {
            el.style.opacity = '0';
            el.style.transform = 'translateY(6px)';
            setTimeout(() => el.remove(), 180);
          }, 3400);
        }

          document.getElementById('modal-title').textContent = title;

        function computeSimulatorProjection(sim) {
          const dCount = Number(sim.destaqueCount || 0);
          const pCount = Number(sim.proCount || 0);
          const missions = Math.max(1, Number(sim.missionsVolume || 1));

          const mrrSim = dCount * PLANS.destaque.fee + pCount * PLANS.pro.fee;
          const taxaOpSim = +(mrrSim * 0.10).toFixed(2);
          const liqSim = +(mrrSim - taxaOpSim).toFixed(2);

          const admShare = +(liqSim * 0.45).toFixed(2);
          const perFounderShare = +(admShare / 2).toFixed(2);
          const fieldPool = +(liqSim * 0.35).toFixed(2);
          const supShare = +(liqSim * 0.10).toFixed(2);
          const regShare = +(liqSim * 0.10).toFixed(2);
          const avgPerMission = +(fieldPool / missions).toFixed(2);
          const avgWithBonus = +(avgPerMission * 1.2).toFixed(2);

          return { dCount, pCount, missions, mrrSim, taxaOpSim, liqSim, admShare, perFounderShare, fieldPool, supShare, regShare, avgPerMission, avgWithBonus };
        }

          const r = 58;
          const circ = 2 * Math.PI * r;
          const slices = [
            { label: 'Plataforma / ADMs', pct: 45, val: fin.rateio.plataformaADMs, color: '#10b981', textCls: 'text-emerald-400', dotCls: 'bg-emerald-500' },

            { label: 'Gestor Regional', pct: 10, val: fin.rateio.gestorRegional, color: '#818cf8', textCls: 'text-indigo-400', dotCls: 'bg-indigo-400' },
          ];
          let cumulativePct = 0;
          const donutCircles = slices
            .map((s) => {
              const dashLen = (s.pct / 100) * circ;
              const offset = -((cumulativePct / 100) * circ);
              cumulativePct += s.pct;
              return `<circle cx="80" cy="80" r="${r}" fill="transparent" stroke="${s.color}" stroke-width="20" stroke-dasharray="${dashLen.toFixed(2)} ${(circ - dashLen).toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}" />`;
            })

          return `

        function updateSimulatorDOM() {
          const proj = computeSimulatorProjection(state.simulator);
          const setTxt = (id, txt) => {
            const el = document.getElementById(id);
            if (el) el.textContent = txt;
          };
          setTxt('sim-destaque-val', `${proj.dCount} loja(s)`);
          setTxt('sim-pro-val', `${proj.pCount} loja(s)`);
          setTxt('sim-missions-val', `${proj.missions} missões`);
          setTxt('sim-out-liq', formatBRL(proj.liqSim));
          setTxt('sim-out-mrr', `Bruto: ${formatBRL(proj.mrrSim)}`);
          setTxt('sim-out-adm', formatBRL(proj.admShare));
          setTxt('sim-out-adm-split', `Hevert ${formatBRL(proj.perFounderShare)} · Robson ${formatBRL(proj.perFounderShare)}`);
          setTxt('sim-out-field', formatBRL(proj.fieldPool));
          setTxt('sim-out-mission-unit', `${formatBRL(proj.avgPerMission)}/missão (1.2x: ${formatBRL(proj.avgWithBonus)})`);
          setTxt('sim-out-sup', formatBRL(proj.supShare));
          setTxt('sim-out-reg', formatBRL(proj.regShare));
          setTxt('sim-out-tax', formatBRL(proj.taxaOpSim));
        }

        function bindDashboardEvents() {
          document.getElementById('sim-destaque')?.addEventListener('input', (e) => {
            state.simulator.destaqueCount = Number(e.target.value);
            saveState(false);
            updateSimulatorDOM();
          });
          document.getElementById('sim-pro')?.addEventListener('input', (e) => {
            state.simulator.proCount = Number(e.target.value);
            saveState(false);
            updateSimulatorDOM();
          });
          document.getElementById('sim-missions')?.addEventListener('input', (e) => {
            state.simulator.missionsVolume = Number(e.target.value);
            saveState(false);
            updateSimulatorDOM();
          });
          document.getElementById('btn-sim-sync-current')?.addEventListener('click', () => {
            const pScope = state.selectedPlazaId || 'all';
            const mkts = state.supermarkets.filter((m) => (pScope === 'all' ? true : m.plazaId === pScope));
            const dNow = mkts.filter((m) => m.plan === 'destaque').length;
            const pNow = mkts.filter((m) => m.plan === 'pro').length;
            const mNow = Math.max(10, state.team.filter((u) => u.role === 'field' && (pScope === 'all' ? true : u.plazaId === pScope)).reduce((s, u) => s + (u.completedMissions || 0), 0));
            state.simulator = { destaqueCount: dNow, proCount: pNow, missionsVolume: mNow };
            saveState(false);
            renderApp();
            showToast('Simulador sincronizado com os dados reais do filtro atual.', 'success');
          });
        }

                <button type="button" data-admin-sub="regional" class="px-3 py-1 text-xs font-semibold rounded-md ui-transition ${isRegional ? 'bg-sky-600 text-white' : 'text-slate-400 hover:text-white'}">

        // --------------------------------------------------------------------
        // 12. PUBLICAÇÃO NO ÍNDICE CMA (APÓS CONFIRMAÇÃO DO SUPERVISOR)
        // --------------------------------------------------------------------
        function publishAuditToStore(col) {
          const prod = getProduct(col.productId);
          if (prod) {
            const existing = prod.prices.find((p) => p.marketId === col.marketId);
            if (existing) {
              existing.price = col.collectedPrice;
              existing.auditedAt = new Date().toISOString();
              existing.available = col.available;
            } else {
              prod.prices.push({
                marketId: col.marketId,
                price: col.collectedPrice,
                auditedAt: new Date().toISOString(),
                available: col.available,
              });
            }
          }

          const mkt = getMarket(col.marketId);
          if (mkt) {
            if (!Array.isArray(mkt.audits)) mkt.audits = [];
            mkt.audits.push({
              preco: col.scores.preco,
              estoque: col.scores.estoque,
              transparencia: col.scores.transparencia,
              rechecadaSupervisor: Boolean(col.rechecadaSupervisor),
            });
          }

          const insp = getUser(col.inspectorId);
          if (insp) {
            insp.completedMissions += 1;
          }
        }

        function syncHeaderAndTheme() {
          const isDark = state.activeModule !== 'vitrine';
          document.documentElement.classList.toggle('dark', isDark);

          const plazaSel = document.getElementById('global-plaza-select');
          if (plazaSel) {
            plazaSel.innerHTML = `
              <option value="all">Todas as Praças (${state.plazas.length})</option>
              ${state.plazas.map((p) => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}
            `;
            plazaSel.value = state.selectedPlazaId || 'all';
          }

          const profSel = document.getElementById('profile-session-select');
          if (profSel) profSel.value = state.activeSessionProfile;

          document.querySelectorAll('.module-tab').forEach((btn) => {
            const active = btn.dataset.module === state.activeModule;
            btn.classList.remove(
              'border-emerald-600',
              'border-emerald-400',
              'text-slate-900',
              'text-white',
              'border-transparent',
              'text-slate-600',
              'text-slate-400',
              'hover:text-slate-900',
              'hover:text-white'
            );
            if (active) {
              btn.classList.add(isDark ? 'border-emerald-400' : 'border-emerald-600', isDark ? 'text-white' : 'text-slate-900');
            } else {
              btn.classList.add('border-transparent', isDark ? 'text-slate-400' : 'text-slate-600', isDark ? 'hover:text-white' : 'hover:text-slate-900');
            }
          });

          const hint = document.getElementById('header-scope-hint');
          if (hint) {
            const roleBase = getSessionRoleBase();
            const user = roleBase === 'consumer' ? null : getActiveSessionUser(roleBase);
            hint.textContent = user
              ? `${user.name} · ${user.plazaId === 'all' ? 'Acesso Global' : getPlazaName(user.plazaId)}`
              : `Vitrine · ${getPlazaName(state.selectedPlazaId)}`;
          }
        }

        function bindSupervisorEvents() {
          document.getElementById('switch-sup-user')?.addEventListener('change', (e) => {
            state.sessionUserIds.supervisor = e.target.value;
            const u = getUser(e.target.value);
            if (u && u.plazaId !== 'all') state.selectedPlazaId = u.plazaId;
            saveState(false);
            renderApp();
          });

          document.querySelectorAll('[data-sup-tab]').forEach((btn) => {
            btn.addEventListener('click', () => {
              state.filters.supervisorTab = btn.dataset.supTab;
              saveState(false);
              renderApp();
            });
          });

          document.querySelectorAll('[data-sup-action]').forEach((btn) => {
            btn.addEventListener('click', () => {
              const action = btn.dataset.supAction;
              const col = state.collections.find((c) => c.id === btn.dataset.colId);
              if (!col) return;
              const insp = getUser(col.inspectorId);
              const sup = getActiveSessionUser('supervisor');

              if (action === 'confirm') {
                col.status = 'confirmed';
                col.rechecadaSupervisor = true;
                col.supervisorNote = 'Rechecada e confirmada (peso 1.5x no CMA)';
                if (insp) insp.reputation = Math.min(100, insp.reputation + 2);
                sup.completedMissions += 1;
                publishAuditToStore(col);
                showToast(`Rechecagem confirmada! ${insp?.name || 'Fiscal'} (+2 pts) e CMA recalculado com peso 1.5x.`, 'success');
              } else if (action === 'divergence') {
                col.status = 'divergence';
                col.supervisorNote = 'Divergência leve (-10 pts)';
                if (insp) insp.reputation = Math.max(0, insp.reputation - 10);
                sup.completedMissions += 1;
                state.notices.unshift({
                  id: `not-${Date.now().toString().slice(-5)}`,
                  authorId: sup.id,
                  authorName: `${sup.name} (Supervisor)`,
                  target: 'field',
                  scopePlazaId: sup.plazaId,
                  recipientUserId: insp?.id || null,
                  title: 'Aviso — Divergência Leve',
                  message: `Divergência na coleta ${col.receiptCode}. Penalidade aplicada: -10 pts na reputação.`,
                  createdAt: new Date().toISOString(),
                });
                showToast(`Divergência registrada: -10 pts e aviso enviado a ${insp?.name || 'fiscal'}.`, 'warning');
              } else if (action === 'fraud') {
                col.status = 'fraud';
                col.supervisorNote = 'Fraude detectada (-50 pts + Bloqueio)';
                if (insp) {
                  insp.reputation = Math.max(0, insp.reputation - 50);
                  insp.blocked = true;
                }
                sup.completedMissions += 1;
                state.notices.unshift({
                  id: `not-${Date.now().toString().slice(-5)}`,
                  authorId: sup.id,
                  authorName: `${sup.name} (Supervisor)`,
                  target: 'field',
                  scopePlazaId: sup.plazaId,
                  recipientUserId: insp?.id || null,
                  title: 'Bloqueio de Vaga — Fraude Detectada',
                  message: `Fraude confirmada na coleta ${col.receiptCode}. Corte de -50 pts e bloqueio imediato de vaga.`,
                  createdAt: new Date().toISOString(),
                });
                showToast(`Fraude detectada: -50 pts e vaga de ${insp?.name || 'fiscal'} bloqueada!`, 'error');
              }

              saveState(true);
              renderApp();
            });
          });
        }

                      recipientUserId: user.id,
                      title: `Penalidade Administrativa (-${pts} pts)`,
                      message: String(fd.get('reason')).trim(),
                      createdAt: new Date().toISOString(),
                    });
                    saveState(true);
                    closeModal();
                    renderApp();
                    showToast(`-${pts} pts aplicados a ${user.name}.`, 'warning');
                  });
                }
              );
            });
          });

          document.querySelectorAll('[data-usr-notice]').forEach((btn) => {
            btn.addEventListener('click', () => {
              const user = getUser(btn.dataset.usrNotice);
              const founder = getActiveSessionUser('admin');
              if (!user) return;
              openModal(
                `Aviso Individual — ${user.name}`,
                `
                  <form id="modal-ind-notice" class="space-y-4">
                    <div>
                      <label for="in-title" class="block text-xs font-semibold mb-1.5">Título</label>
                      <input id="in-title" name="title" type="text" required value="Orientação Individual" class="w-full px-3 py-2 text-sm rounded-lg border border-slate-700 bg-slate-950 text-white" />
                    </div>
                    <div>
                      <label for="in-msg" class="block text-xs font-semibold mb-1.5">Mensagem</label>
                      <textarea id="in-msg" name="message" rows="3" required placeholder="Escreva a orientação para ${esc(user.name)}..." class="w-full px-3 py-2 text-sm rounded-lg border border-slate-700 bg-slate-950 text-white"></textarea>
                    </div>
                    <div class="flex justify-end gap-2 pt-2">
                      <button type="button" id="in-cancel" class="px-4 py-2 text-sm rounded-lg border border-slate-700 text-slate-300">Cancelar</button>
                      <button type="submit" class="px-4 py-2 text-sm font-semibold rounded-lg bg-emerald-600 text-white hover:bg-emerald-500">Enviar Aviso</button>
                    </div>
                  </form>
                `,
                (body) => {
                  body.querySelector('#in-cancel').addEventListener('click', closeModal);
                  body.querySelector('#modal-ind-notice').addEventListener('submit', (ev) => {
                    ev.preventDefault();
                    const fd = new FormData(ev.target);
                    state.notices.unshift({
                      id: `not-${Date.now().toString().slice(-5)}`,
                      authorId: founder.id,
                      authorName: founder.name,
                      target: user.role,
                      scopePlazaId: user.plazaId,
                      recipientUserId: user.id,
                      title: String(fd.get('title')).trim(),
                      message: String(fd.get('message')).trim(),
                      createdAt: new Date().toISOString(),
                    });
                    saveState(false);
                    closeModal();
                    renderApp();
                    showToast(`Aviso individual enviado a ${user.name}.`, 'success');
                  });
                }
              );
            });
          });

          document.querySelectorAll('[data-usr-suspend]').forEach((btn) => {
            btn.addEventListener('click', () => {
              const user = getUser(btn.dataset.usrSuspend);
              if (!user || user.founder) return;
              if (user.suspended || user.blocked) {
                user.suspended = false;
                user.blocked = false;
                user.reputation = Math.max(60, user.reputation);
                showToast(`Cadastro de ${user.name} reativado.`, 'success');
              } else {
                user.suspended = true;
                showToast(`Cadastro de ${user.name} suspenso.`, 'warning');
              }
              saveState(true);
              renderApp();
            });
          });

          document.querySelectorAll('[data-usr-delete]').forEach((btn) => {
            btn.addEventListener('click', () => {
              const user = getUser(btn.dataset.usrDelete);
              if (!user || user.founder) return;
              state.team = state.team.filter((u) => u.id !== user.id);
              saveState(true);
              renderApp();
              showToast(`${user.name} excluído da equipe.`, 'warning');
            });
          });

          bindMarketControls();
        }

        // --------------------------------------------------------------------
        // 14. NAVEGAÇÃO GLOBAL DE PRAÇA, PERFIS, MÓDULOS & RESET DEMO
        // --------------------------------------------------------------------
        function syncLocalUsersToPlaza(plazaId) {
          if (plazaId === 'all') return;
          const findInPlaza = (role) => state.team.find((u) => u.role === role && u.plazaId === plazaId);
          const reg = findInPlaza('regional');
          const sup = findInPlaza('supervisor');
          const fld = findInPlaza('field');
          if (reg) state.sessionUserIds.regional = reg.id;
          if (sup) state.sessionUserIds.supervisor = sup.id;
          if (fld) state.sessionUserIds.field = fld.id;
        }

        function switchSessionProfile(profileKey) {
          state.activeSessionProfile = profileKey;
          if (profileKey === 'consumer') {
            state.activeModule = 'vitrine';
          } else if (profileKey === 'field') {
            state.activeModule = 'portal';
            state.portalSubView = 'field';
            syncLocalUsersToPlaza(state.selectedPlazaId);
          } else if (profileKey === 'supervisor') {
            state.activeModule = 'portal';
            state.portalSubView = 'supervisor';
            syncLocalUsersToPlaza(state.selectedPlazaId);
          } else if (profileKey === 'regional') {
            state.activeModule = 'admin';
            state.adminSubView = 'regional';
            syncLocalUsersToPlaza(state.selectedPlazaId);
          } else if (profileKey === 'admin_hevert') {
            state.activeModule = 'admin';
            state.adminSubView = 'founders';
            state.sessionUserIds.admin = 'usr-adm-hevert';
          } else if (profileKey === 'admin_robson') {
            state.activeModule = 'admin';
            state.adminSubView = 'founders';
            state.sessionUserIds.admin = 'usr-adm-robson';
          }
          saveState(false);
          renderApp();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function switchModule(mod) {
          state.activeModule = mod;
          if (mod === 'vitrine') state.activeSessionProfile = 'consumer';
          else if (mod === 'portal' && state.activeSessionProfile !== 'field' && state.activeSessionProfile !== 'supervisor') {
            state.activeSessionProfile = state.portalSubView || 'field';
          } else if (mod === 'admin' && !['admin_hevert', 'admin_robson', 'regional'].includes(state.activeSessionProfile)) {
            state.activeSessionProfile = state.adminSubView === 'regional' ? 'regional' : state.sessionUserIds.admin === 'usr-adm-robson' ? 'admin_robson' : 'admin_hevert';
          }
          saveState(false);
          renderApp();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        document.getElementById('global-plaza-select')?.addEventListener('change', (e) => {
          state.selectedPlazaId = e.target.value;
          state.filters.consumerNeighborhood = 'all';
          state.filters.rankingNeighborhood = 'all';
          syncLocalUsersToPlaza(state.selectedPlazaId);
          saveState(false);
          renderApp();
        });

        document.getElementById('profile-session-select')?.addEventListener('change', (e) => switchSessionProfile(e.target.value));
        document.querySelectorAll('[data-module]').forEach((btn) => btn.addEventListener('click', () => switchModule(btn.dataset.module)));
        document.getElementById('brand-home-link')?.addEventListener('click', (e) => {
          e.preventDefault();
          switchSessionProfile('consumer');
        });

        document.getElementById('btn-close-modal')?.addEventListener('click', closeModal);
        document.getElementById('app-modal-backdrop')?.addEventListener('click', (e) => {
          if (e.target.id === 'app-modal-backdrop') closeModal();
        });

        document.getElementById('btn-rebuild-cache')?.addEventListener('click', () => {
          cacheEngine.invalidateAll();
          renderApp();
          showToast('Cache local revalidado.', 'success');
        });

        document.getElementById('btn-reset-demo')?.addEventListener('click', () => {
          openModal(
            'Resetar Dados Demo',
            `
              <div class="space-y-4">
                <p class="text-sm text-slate-600 dark:text-slate-300">
                  Restaura o conjunto inicial multipraça no localStorage: Januária - MG e Praça Parceira (Outro Estado), Hevert Pereira e Robson Waynne como ADMs-Fundadores, gestores, supervisores 1:50, 6 fiscais de campo, 6 supermercados entre os 3 planos e histórico inicial.
                </p>
                <div class="flex justify-end gap-2 pt-2">
                  <button type="button" id="rst-cancel" class="px-4 py-2 text-sm rounded-lg border border-slate-300 dark:border-slate-700">Cancelar</button>
                  <button type="button" id="rst-confirm" class="px-4 py-2 text-sm font-semibold rounded-lg bg-rose-600 text-white hover:bg-rose-700">Confirmar Reset</button>
                </div>
              </div>
            `,
            (body) => {
              body.querySelector('#rst-cancel').addEventListener('click', closeModal);
              body.querySelector('#rst-confirm').addEventListener('click', () => {
                const prof = state.activeSessionProfile;
                const mod = state.activeModule;
                state = createInitialState();
                state.activeSessionProfile = prof;
                state.activeModule = mod;
                selectedMissionId = null;
                saveState(true);
                closeModal();
                renderApp();
                showToast('Dados Demo multipraça restaurados no localStorage.', 'success');
              });
            }
          );
        });

        renderApp();
      })();
    </script>
  </body>
</html>
